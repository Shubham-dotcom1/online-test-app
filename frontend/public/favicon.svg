<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Primary Blue Container -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  
  <!-- Inner White Card -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#ffffff"/>
  
  <!-- Quadrant A -->
  <rect x="10" y="10" width="20" height="20" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#2563eb" text-anchor="middle">A</text>
  
  <!-- Quadrant B: Correct Answer with Emerald Green -->
  <rect x="34" y="10" width="20" height="20" rx="5" fill="#10b981"/>
  <path d="M38 20L42.5 24.5L50 15.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Quadrant C -->
  <rect x="10" y="34" width="20" height="20" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="20" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#2563eb" text-anchor="middle">C</text>
  
  <!-- Quadrant D -->
  <rect x="34" y="34" width="20" height="20" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#2563eb" text-anchor="middle">D</text>
</svg>
